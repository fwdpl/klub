<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%VITE_APP_NAME%</title>
    <meta name="description" content="Wyjazdy grupy: plan, informacje i checklisty w jednym miejscu." />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <!-- Motyw ustawiany przed renderem, żeby nie było błysku -->
    <script>
      (function () {
        var pref = 'auto';
        try { pref = localStorage.getItem('klub.theme') || 'auto'; } catch (e) {}
        var dark = pref === 'dark' || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <link rel="icon" type="image/png" href="%VITE_ICON_DIR%/favicon-48.png" />
    <link rel="apple-touch-icon" href="%VITE_ICON_DIR%/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="%VITE_APP_SHORT_NAME%" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Ekrany startowe iOS (generuje scripts/generate_assets.py) -->

  <body>
    <div id="splash" class="splash" aria-hidden="true">
      <div class="splash__bar"><div class="splash__progress"></div></div>
